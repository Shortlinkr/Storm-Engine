<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storm Engine</title>
<style>
  body {
    margin: 0;
    background: #0a0f1c;
    overflow: hidden;
  }

  #flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="flash"></div>

<script>
document.body.addEventListener("click", () => {
  const test = new Audio("sounds/rain/rain_loop.wav");
  test.volume = 1;

  test.play()
    .then(() => console.log("playing"))
    .catch(err => console.log("FAILED:", err));
});
</script>
</body>
</html>
